<label
  class="form-control-label"
  [class.disabled]="isDisabled"
  [class.clickable]="isLabelClickable"
  [attr.for]="inputId"
  (click)="onLabelClick && onLabelClick($event)">
  <ng-content select="vcl-label, [vclLabel]"></ng-content>
  @if (hideRequiredIndicator !== true && isRequired) {
    <em aria-hidden="true" class="required-indicator">•</em>
  }
</label>
<ng-content></ng-content>
<ng-content
  select="vcl-hint, vcl-hint-error, vcl-hint-warning, vcl-hint-success, [vclHint]"></ng-content>
