<ng-template [vclLayer] #helpLayer="vclLayer">
  <vcl-panel-dialog [style.width]="layerWidth">
    @if (title) {
      <vcl-panel-title>{{ title }}</vcl-panel-title>
    }
    <span [innerHTML]="text"></span>
    <button
      vcl-button
      vclPanelFooterButton
      class="transparent outline"
      (click)="helpLayer.close()">
      {{ confirmButtonLabel }}
    </button>
  </vcl-panel-dialog>
</ng-template>

<ng-content></ng-content>
<div class="spacer"></div>
@if (help) {
  <button
    vcl-button
    square
    class="transparent"
    (click)="helpLayer.open()"
    type="button">
    <vcl-icon class="scale130p" [icon]="icon"></vcl-icon>
  </button>
}
