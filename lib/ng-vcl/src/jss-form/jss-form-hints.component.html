@for (hint of hints$ | async; track hint) {
  @if (hint.type === 'default') {
    <vcl-hint>{{ hint.message }}</vcl-hint>
  }
  @if (hint.type === 'warning') {
    <vcl-hint-warning>{{ hint.message }}</vcl-hint-warning>
  }
  @if (hint.type === 'error') {
    <vcl-hint-error [error]="hint.error">{{ hint.message }}</vcl-hint-error>
  }
}
