<ng-template
  vclPopover
  #popover="vclPopover"
  [visible]="visible"
  [target]="target"
  [positions]="positions">
  <div class="tour-container">
    @if (title) {
      <div class="tour-container-header">
        {{ title }}
      </div>
    }

    <div class="tour-container-content">
      <ng-content></ng-content>
    </div>

    <div class="tour-container-footer gutterx-3">
      @if (hasPrevious) {
        <button
          vcl-button
          type="button"
          [ngClass]="$safeNavigationMigration(tour.options?.buttonClass)"
          (click)="previous()">
          <vcl-icogram>
            {{ tour.options?.previousLabel }}
            @if (tour.options?.previousIcon) {
              <vcl-icon
                vclPrepend
                [icon]="
                  $safeNavigationMigration(tour.options?.previousIcon)
                "></vcl-icon>
            }
          </vcl-icogram>
        </button>
      }

      @if (hasNext) {
        <button
          vcl-button
          type="button"
          [ngClass]="$safeNavigationMigration(tour.options?.buttonClass)"
          (click)="next()">
          <vcl-icogram>
            {{ tour.options?.nextLabel }}
            @if (tour.options?.nextIcon) {
              <vcl-icon
                vclAppend
                [icon]="
                  $safeNavigationMigration(tour.options?.nextIcon)
                "></vcl-icon>
            }
          </vcl-icogram>
        </button>
      }

      <button
        vcl-button
        type="button"
        [ngClass]="$safeNavigationMigration(tour.options?.buttonClass)"
        (click)="exit()">
        <vcl-icogram>
          @if (tour.options?.exitIcon) {
            <vcl-icon
              vclPrepend
              [icon]="
                $safeNavigationMigration(tour.options?.exitIcon)
              "></vcl-icon>
          }
          {{ tour.options?.exitLabel }}
        </vcl-icogram>
      </button>
    </div>
  </div>
</ng-template>
