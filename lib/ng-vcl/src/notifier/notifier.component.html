@if (notifierOverlayRef?.title || showCloseButton) {
  <div class="notification-header title-container row align-items-center">
    @if (notifierOverlayRef.title) {
      <div class="flex">
        <span>{{ notifierOverlayRef.title }}</span>
      </div>
    }
    <div class="flex"></div>
    @if (showCloseButton) {
      <button
        vcl-button
        square
        type="button"
        (click)="onCloseClick()"
        class="transparent">
        <vcl-icon icon="vcl:close"></vcl-icon>
      </button>
    }
  </div>
}
@if (hasIcon) {
  <div class="notification-icon-container">
    <vcl-icon class="notification-icon" [icon]="icon || typeIcon"></vcl-icon>
  </div>
}
<div class="notification-content row">
  <div class="flex">
    @if (notifierOverlayRef.contentIsString) {
      <div>{{ notifierOverlayRef.content }}</div>
    }
    @if (notifierOverlayRef.contentIsPortal) {
      <div [cdkPortalOutlet]="notifierOverlayRef.content"></div>
    }
  </div>
</div>
